<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- simple bar-chart mark -->
  <g transform="translate(70,70)">
    <rect x="0"  y="90" width="26" height="40" rx="4" fill="#334155"/>
    <rect x="34" y="60" width="26" height="70" rx="4" fill="#475569"/>
    <rect x="68" y="30" width="26" height="100" rx="4" fill="url(#accent)"/>
    <rect x="102" y="50" width="26" height="80" rx="4" fill="#64748b"/>
  </g>

  <text x="250" y="120" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">ai-stats</text>
  <text x="252" y="165" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Usage, cost &amp; token statistics for every LLM you use</text>

  <text x="252" y="205" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22d3ee">OpenAI</text>
  <text x="335" y="205" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#818cf8">Anthropic</text>
  <text x="440" y="205" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Ollama</text>
  <text x="525" y="205" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">LM Studio</text>
  <text x="630" y="205" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#64748b">Google · xAI (via import)</text>
</svg>
